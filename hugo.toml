# baseURL 莫擅改！会影响SEO
baseURL = 'https://swaw.com/'
languageCode = 'en-us'
title = 'swaw'
theme = "banyan"
preserveTaxonomyNames = true
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
timeZone = "Asia/Shanghai"

enableGitInfo = false
panicOnWarning = true

[params]
# If account_url is empty or commented out, the login button will ONLY show the logo and link to the Banyan theme GitHub repo.
# If configured, it will show the "Account" text and link to the specified URL.
account_url = "https://github.com/swawai"
copyright = "人不工智能 &middot; Swaw LLC"
icp = "粤ICP备2024338434号"
[params.link_prefetch]
# 四类链接预取模式：
#   "" / "off" = 关闭该类预取
#   transport:
#     spec = Speculation Rules
#     link = rel=prefetch
#     sw   = SW warmup
#   eagerness:
#     s = conservative
#     m = moderate
#     x = eager
#   kind:
#     f = prefetch
#     r = prerender
#   示例：
#     spec_sf / spec_mf / spec_xf
#     spec_sr / spec_mr / spec_xr
#     link_sf / link_mf / link_xf
#     sw_sf   / sw_mf   / sw_xf
# 建议：
#   sort_siblings 适合 "*-prefetch"
#   descendants 适合 "" / "*-prefetch"
#   post 适合 "" / "*-prefetch" / "*-prerender"
#   nav 适合 "" / "*-prefetch"
# 说明补充：
#   当前只支持显式环境表：
#   [params.link_prefetch.env.TTT] / [params.link_prefetch.env.FTT] ...
#   每个环境都直接写完整策略，不再做全局默认值合并
#   T/F 三位依次表示：
#      第 1 位 = SpeculationRules transport 可用
#      第 2 位 = rel=prefetch transport 可用
#      第 3 位 = SW transport 可用/允许（不是 active worker 已就绪）
#   Hugo 会把这些显式环境配置直接编译为 env 专属动作 bundle；若某环境下引用了
#   不可用 transport，编译期直接报错，而不是留给运行时回退。
#   运行时可用 ?prefetch_env=TTT 这类参数强制选择环境，便于测试回退路径；
#   ?prefetch_env=auto 可清除该强制值并恢复自动探测。
# 说明：
#   Hugo 会为每个非空环境动作集单独打出一个 prefetch bundle，
#   并在编译期直接展开成最终动作 payload；head 内联 bootstrap
#   只做一次环境判断，然后只加载命中的那个 bundle。
#   当前 sort_siblings / descendants / post / nav 分别对应排序兄弟项 /
#   descendants / post / 菜单与面包屑导航。

[params.link_prefetch.env.TTT]
nav = "spec_xr"
sort_siblings = "link_xf"
descendants = "sw_xf"
post = "sw_xf"

[params.link_prefetch.env.TTF]
nav = "spec_xr"
sort_siblings = "spec_xr"
descendants = "spec_xf"
post = "spec_xf"


[params.link_prefetch.env.FTT]
nav = "link_xf"
sort_siblings = "link_xf"
descendants = "link_xf"
post = "link_xf"

[params.link_prefetch.env.FTF]
nav = "link_xf"
sort_siblings = "link_xf"
descendants = "link_xf"
post = "link_xf"

[params.service_worker]
# mode:
#   "enable"  = 注册 /sw.js，启用 HTML 导航 stale-while-revalidate，并在检测到新版本时做弱提醒
#   "disable" = 不再启用 SW；页面会尝试注销旧注册并清理本项目缓存，同时继续输出一个惰性 /sw.js 便于旧注册尽快退场
#   "off"     = 不注入 SW 管理脚本，也不输出 /sw.js；适合在 disable 跑够一段时间后彻底停用
mode = "enable"
# 建议发布时手动维护；若留空则回退到本次构建时间戳。
# version = "202603110001"
# 留空：仅启用 HTML 导航页缓存
# 非空：在此基础上，对这些同源静态资源后缀额外启用 cache-first
# 建议只填强缓存、文件名已 hash 的静态资源类型
# cache_first_extensions = ["css", "js", "svg", "png", "ico", "woff2", "webmanifest"]

[params.social]
github = "https://github.com/swawai"

[frontmatter]
lastmod = ["lastmod", ":git", ":fileModTime", ":default"]

[pagination]
pagerSize = 30
[taxonomies]
udc = "udc"
tag = "tags"

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true
[markup.minify]
disableXML = true

[mediaTypes."application/manifest+json"]
suffixes = ["webmanifest"]
[mediaTypes."application/javascript"]
suffixes = ["js"]

