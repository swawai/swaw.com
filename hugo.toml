# baseURL 莫擅改！会影响SEO
baseURL = 'https://swaw.com/'
languageCode = 'en-us'
title = 'swaw'
theme = "banyan"
preserveTaxonomyNames = true
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
timeZone = "Asia/Shanghai"

enableGitInfo = true
panicOnWarning = true

[build]
# 禁止 Hugo js.Build 自动写入 assets/jsconfig.json；该文件只服务编辑器跳转，不参与站点构建。
noJSConfigInAssets = true

[cascade.build]
# Page bundle resources should be published only through explicit theme pipelines.
publishResources = false

# Theme runtime defaults live in themes/banyan/hugo.toml. This root config keeps
# swaw.com identity, Hugo structural declarations, and deployment-specific
# overrides only.

[params.prefetch_runtime]
mode = "enable"

[params.service_worker]
mode = "enable"

[params.sitemap]
include_pages = ["/about", "/changelog", "/wechat"]

[frontmatter]
lastmod = ["lastmod", ":git", ":default"]

[pagination]
pagerSize = 30
[taxonomies]
intent = "intent"
tag = "tags"
# udc = "udc"
# category = "categories"
# author = "authors"
#
# ExampleSite ships sample taxonomy bundles under:
#   - content/intent/_index.<lang>.md => intent sample
#   - content/tags/_index.<lang>.md   => tags sample
# Each taxonomy must define its own [banyan_taxonomy] in the root bundle.
# Theme i18n and params.banyan.taxonomies.* are no longer taxonomy metadata sources.


[markup]
[markup.highlight]
noClasses = false
style = "vs"
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = false
[markup.minify]
disableXML = true

# Output format definitions live in themes/banyan/hugo.toml. Root [outputs]
# entries still opt the site into each generated output.
[outputs]
page     = ["HTML"]
section  = ["HTML","RSS"]
home     = ["HTML","RSS","LLMS"]
taxonomy = ["HTML","RSS"]
term     = ["HTML","RSS"]

[languages]
[languages.en]
languageName = "English"
weight = 1
[languages.en.params]
locale = "en_US"

[languages.zh]
languageName = "中文"
weight = 2

[languages.zh.params]
locale = "zh_CN"

[languages.zh-tw]
languageName = "繁體"
weight = 3

[languages.zh-tw.params]
locale = "zh_TW"

[permalinks]

d = "/p/:slug/"
