# baseURL 莫擅改！会影响SEO
baseURL = 'https://swaw.com/'
languageCode = 'en-us'
title = 'swaw'
theme = "banyan"
preserveTaxonomyNames = true
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
timeZone = "Asia/Shanghai"

enableGitInfo = false
panicOnWarning = true

[params]
# If account_url is empty or commented out, the login button will ONLY show the logo and link to the Banyan theme GitHub repo.
# If configured, it will show the "Account" text and link to the specified URL.
account_url = "https://github.com/swawai"
copyright = "人不工智能 &middot; Swaw LLC"
icp = "粤ICP备2024338434号"
[params.link_prefetch]
# 四类链接预取模式：
#   "" / "off" = 关闭该类预取
#   transport:
#     spec = Speculation Rules
#     link = rel=prefetch
#     sw   = SW warmup
#   eagerness:
#     s = conservative
#     m = moderate
#     x = eager
#   kind:
#     f = prefetch
#     r = prerender
#   示例：
#     spec_sf / spec_mf / spec_xf
#     spec_xf_g
#     spec_sr / spec_mr / spec_xr
#     link_sf / link_mf / link_xf
#     sw_sf   / sw_mf   / sw_xf
#   global gate:
#     追加 _g = 基于 sessionStorage 的全局一次性 gate；
#     同一浏览会话里，完全相同的一组预热动作只首次执行一次
# 建议：
#   menu 适合 "*-prefetch" / "*-prerender" / "*_g"
#   sort_siblings 适合 "*-prefetch"
#   descendants 适合 "" / "*-prefetch"
#   post 适合 "" / "*-prefetch" / "*-prerender"
#   nav 适合 "" / "*-prefetch"
# 说明补充：
#   当前只支持显式环境表：
#   [params.link_prefetch.env.TTT] / [params.link_prefetch.env.FTT] ...
#   如需复用，可在某环境表里写：
#      ref = "FTT"
#   引用只在 Hugo 编译期展开，运行时仍只消费最终动作数据。
#   T/F 三位依次表示：
#      第 1 位 = SpeculationRules transport 可用
#      第 2 位 = rel=prefetch transport 可用
#      第 3 位 = 当前上下文里 Service Worker API 可用
#              这里只看最终 SW API 是否可用，不看 active worker 是否已就绪，
#              也不再叠加站点侧额外“允许 SW transport 参与环境判定”的开关。
#   Hugo 会把这些显式环境配置直接编译为页面级动作数据；运行时统一由共享
#   prefetch runtime 脚本按浏览器能力自动选择当前环境。
#   若某环境下引用了不可用 transport，编译期直接报错，而不是留给运行时回退。
#   调试可直接访问 /prefetch-debug.html 查看当前浏览器环境检测结果、
#   页面 payload 以及实际注入的预热资源。
#   页面级动作数据里的短码约定：
#      sp = speculation rules payload
#      sg = speculation rules payload（带 global gate）
#      ls / lm / lx = link transport 的保守 / 中等 / 激进策略
#      lsg / lmg / lxg = link transport（带 global gate）
#      ws / wm / wx = SW transport 的保守 / 中等 / 激进策略
#      wsg / wmg / wxg = SW transport（带 global gate）
#   注入 HTML 的 site-prefetch-data 会按最终 actions 去重；
#   若两个环境的 actions 完全相同，后者会直接写成前者 env 键的别名字符串，
#   不会产生链式别名。
#   其中当前实现里：
#      s = hover delayed
#      m = hover immediate
#      x = static eager warmup
#   当前会按 menu > nav > sort_siblings > descendants > post 的顺序做全局去重；
#   当前 menu / nav / sort_siblings / descendants / post 分别对应主菜单 / 面包屑与页面导航 / 排序兄弟项 / 后代 / post。

[params.link_prefetch.env.TTT]
menu = "sw_xf_g"
nav = "sw_xf_g"
sort_siblings = "sw_xf_g"
descendants = "sw_xf_g"
post = "sw_mf_g"
[params.link_prefetch.env.TFT]
ref="TTT"
[params.link_prefetch.env.FTT]
ref="TTT"
[params.link_prefetch.env.FFT]
ref="TTT"

[params.link_prefetch.env.TTF]
menu = "spec_mf"
nav = "spec_xf"
sort_siblings = "spec_xf"
descendants = "spec_mf"
post = "spec_mf"
[params.link_prefetch.env.TFF]
ref = "TTF"

[params.link_prefetch.env.FTF]
menu = "link_mf"
nav = "link_xf"
sort_siblings = "link_xf"
descendants = "link_mf"
post = "link_mf"




[params.service_worker]
# mode:
#   "enable"  = 注册 /sw.js，启用 HTML 导航 cache-first（按版本切桶失效），并在检测到新版本时做弱提醒
#   "disable" = 不再启用 SW；页面会尝试注销旧注册并清理本项目缓存，同时继续输出一个惰性 /sw.js 便于旧注册尽快退场
#   "off"     = 不注入 SW 管理脚本，也不输出 /sw.js；适合在 disable 跑够一段时间后彻底停用
mode = "enable"
# 建议发布时手动维护；若留空则回退到本次构建时间戳。
# version = "202603110001"
# 指纹/hash 资源会自动走独立 cache-first 缓存，无需在此重复声明
# 留空：仅启用 HTML 导航缓存 + 自动指纹资源缓存
# 非空：在此基础上，对这些同源无 hash 静态资源后缀额外启用 cache-first
# 仅建议用于你确认可按版本切桶失效的资源类型
# cache_first_extensions = ["css", "js", "svg", "png", "ico", "woff2", "webmanifest"]

[params.runtime_i18n]
# 共享运行时文案（如 SW 更新提示）的语言回退链。
# key/value 均使用小写语言标签；运行时不再硬编码 zh-hk / zh-mo 等别名。
fallbacks = { "zh-hk" = "zh-tw", "zh-mo" = "zh-tw" }

[params.social]
github = "https://github.com/swawai"

[frontmatter]
lastmod = ["lastmod", ":git", ":fileModTime", ":default"]

[pagination]
pagerSize = 30
[taxonomies]
udc = "udc"
tag = "tags"

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true
[markup.minify]
disableXML = true

[mediaTypes."application/manifest+json"]
suffixes = ["webmanifest"]
[mediaTypes."application/javascript"]
suffixes = ["js"]

[outputFormats]
[outputFormats.byname]
mediaType = "text/html"
isHTML    = true
baseName  = "index"
path      = "by-name"
[outputFormats.bynameasc]
mediaType = "text/html"
isHTML    = true
baseName  = "index"
path      = "by-name-asc"
[outputFormats.bydate]
mediaType = "text/html"
isHTML    = true
baseName  = "index"
#path      = "by-date"
[outputFormats.bydateasc]
mediaType = "text/html"
isHTML    = true
baseName  = "index"
path      = "by-date-asc"
[outputFormats.bycount]
mediaType = "text/html"
isHTML    = true
baseName  = "index"
path      = "by-count"
[outputFormats.bycountasc]
mediaType = "text/html"
isHTML    = true
baseName  = "index"
path      = "by-count-asc"
[outputFormats.allbydate]
mediaType = "text/html"
isHTML    = true
baseName  = "index"
path      = "all-by-date"
[outputFormats.allbydateasc]
mediaType = "text/html"
isHTML    = true
baseName  = "index"
path      = "all-by-date-asc"
[outputFormats.allbypath]
mediaType = "text/html"
isHTML    = true
baseName  = "index"
path      = "all-by-path"
[outputFormats.allbypathasc]
mediaType = "text/html"
isHTML    = true
baseName  = "index"
path      = "all-by-path-asc"
[outputFormats.allbyname]
mediaType = "text/html"
isHTML    = true
baseName  = "index"
path      = "all-by-name"
[outputFormats.allbynameasc]
mediaType = "text/html"
isHTML    = true
baseName  = "index"
path      = "all-by-name-asc"
[outputFormats.allbysize]
mediaType = "text/html"
isHTML    = true
baseName  = "index"
path      = "all-by-size"
[outputFormats.allbysizeasc]
mediaType = "text/html"
isHTML    = true
baseName  = "index"
path      = "all-by-size-asc"
[outputFormats.prefetchdebug]
mediaType = "text/html"
isHTML    = true
baseName  = "prefetch-debug"

# 输出顺序会影响 Hugo 为 list/node 页面选择的主 URL。
# 这里把 bydate 放在最前面，使 /、/tags/、/udc/ 等无 by-* 路径成为默认公开路径；
# 若把 byname 等排到前面，.Permalink / .RelPermalink / .Site.Home.RelPermalink 可能改为指向 /by-name/...。
[outputs]
section  = ["bydate","byname","bynameasc","bydateasc","bycount","bycountasc","allbyname","allbynameasc","allbydate","allbydateasc","allbypath","allbypathasc","allbysize","allbysizeasc","rss"]
home     = ["bydate","byname","bynameasc","bydateasc","bycount","bycountasc","allbyname","allbynameasc","allbydate","allbydateasc","allbypath","allbypathasc","allbysize","allbysizeasc","prefetchdebug","rss"]
taxonomy = ["bydate","byname","bynameasc","bydateasc","bycount","bycountasc","rss"]
term     = ["bydate","byname","bynameasc","bydateasc","bycount","bycountasc","rss"]

[languages]
[languages.en]
languageName = "English"
weight = 1
[languages.en.outputs]
# 英文默认语言也保持相同顺序，避免根路径主 URL 被 /by-name/... 抢占。
section  = ["bydate","byname","bynameasc","bydateasc","bycount","bycountasc","allbyname","allbynameasc","allbydate","allbydateasc","allbypath","allbypathasc","allbysize","allbysizeasc","rss"]
home     = ["bydate","byname","bynameasc","bydateasc","bycount","bycountasc","allbyname","allbynameasc","allbydate","allbydateasc","allbypath","allbypathasc","allbysize","allbysizeasc","prefetchdebug","rss"]
taxonomy = ["bydate","byname","bynameasc","bydateasc","bycount","bycountasc","rss"]
term     = ["bydate","byname","bynameasc","bydateasc","bycount","bycountasc","rss"]
[languages.en.params]
description = "Systems Work, And We..."
locale = "en_US"

[languages.zh]
languageName = "中文"
weight = 2

[languages.zh.params]
description = "swaw——人不工，人生不必由工作定义"
locale = "zh_CN"

[languages.zh-tw]
languageName = "繁體"
weight = 3

[languages.zh-tw.params]
description = "swaw——人不工，人生不必由工作定义"
locale = "zh_TW"

[permalinks]
mypost = "/p/:slug/"
blog = "/p/:slug/"
